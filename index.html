<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#160d20">
<title>DAMEZ07 👑</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #160d20;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100svh;
    color: white;
    overflow-x: hidden;
}

/* BACKGROUND */
.background {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 50% 30%, #48204f 0%, transparent 40%),
      radial-gradient(circle at 10% 90%, #31183e, transparent 40%),
      linear-gradient(145deg, #100b18, #28152e, #100b18);
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.star {
    position: absolute;
    color: #ffe2a0;
    animation: twinkle 2s infinite alternate;
    text-shadow: 0 0 15px #ffcc66;
}

@keyframes twinkle {
    from { opacity: .2; transform: scale(.7); }
    to { opacity: 1; transform: scale(1.3); }
}

/* MAIN */
.main {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100svh;
    padding:
      max(12px, env(safe-area-inset-top))
      14px
      max(12px, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: center;
}

.bio {
    width: 100%;
    max-width: 550px;
    min-height: calc(100svh - 24px);
    position: relative;
    padding: 30px 17px;
    border-radius: 42px;
    background: rgba(20, 13, 28, .83);
    border: 2px solid transparent;
    background-clip: padding-box;
    box-shadow:
      0 0 25px rgba(255, 195, 80, .16),
      inset 0 0 30px rgba(177, 91, 255, .08);
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
}

.bio::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 44px;
    padding: 3px;
    background: conic-gradient(
      #ffca65,
      #ff55d8,
      #8d43ff,
      #39eaff,
      #44ffac,
      #ffca65
    );
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: led 5s linear infinite;
    pointer-events: none;
}

@keyframes led {
    to { filter: hue-rotate(360deg); }
}

/* AVATAR */
.avatar-area {
    position: relative;
    width: 190px;
    height: 190px;
    margin: 0 auto 15px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.avatar-ring {
    position: absolute;
    inset: -13px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #bd52ff;
    border-bottom-color: #ffcf70;
    animation: rotate 5s linear infinite;
    box-shadow: 0 0 18px #b54dff;
}

.avatar-ring.two {
    inset: -24px;
    border: 2px dashed #cda45c;
    animation: rotate 12s linear infinite reverse;
    opacity: .7;
}

.avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 5px solid #ffe2a1;
    background:
      radial-gradient(circle, #8c3dc4, #211027 65%, #050307);
    box-shadow:
      0 0 25px #d74cff,
      0 0 50px rgba(255, 190, 95, .5);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.avatar span {
    font-size: 31px;
    font-weight: 900;
    letter-spacing: -2px;
    color: white;
    text-shadow: 0 0 15px #c34aff;
    transform: rotate(-12deg);
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

/* NAME */
.name {
    font-size: clamp(38px, 10vw, 57px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #ffe5ae;
    text-shadow: 0 0 12px #ffc75b, 0 0 30px #ffb84b;
    margin-top: 15px;
}

.official {
    margin: 13px 0 22px;
    font-size: 15px;
    letter-spacing: 4px;
    color: #a9eaff;
    font-weight: bold;
    text-shadow: 0 0 15px #39cfff;
}

.description {
    font-size: 15px;
    line-height: 1.8;
    color: #e9d9eb;
    margin-bottom: 22px;
}

/* WELCOME */
.welcome {
    display: inline-block;
    margin: 0 auto 30px;
    padding: 13px 22px;
    border: 2px solid #e6ad39;
    border-radius: 50px;
    color: #ffe3a1;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    box-shadow: 0 0 15px rgba(255, 194, 73, .25);
}

/* SOCIAL BUTTONS */
.socials {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    width: 100%;
}

.social {
    position: relative;
    min-height: 108px;
    padding: 13px 9px;
    border-radius: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    text-decoration: none;
    color: white;
    background: linear-gradient(145deg,
        rgba(104, 84, 124, .38),
        rgba(30, 24, 40, .85));
    transition: .3s;
    overflow: hidden;
}

.social::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 27px;
    padding: 2px;
    background: linear-gradient(135deg, var(--color), transparent, var(--color));
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
}

.social:active {
    transform: scale(.94);
    box-shadow: 0 0 25px var(--color);
}

.social-icon {
    width: 48px;
    height: 48px;
    min-width: 48px;
    border-radius: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.08);
    border: 1px solid var(--color);
    color: var(--color);
    font-size: 23px;
    font-weight: 900;
    box-shadow: 0 0 15px rgba(255,255,255,.07);
}

.social-info {
    min-width: 0;
    text-align: center;
}

.social-info h3 {
    font-size: 16px;
    margin-bottom: 7px;
}

.social-info p {
    font-size: 10px;
    letter-spacing: 1.5px;
    font-weight: bold;
    color: #bcb0c5;
}

.arrow {
    font-size: 23px;
    color: var(--color);
}

/* FOOTER */
.footer {
    margin-top: 27px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #e9c87f;
    text-shadow: 0 0 12px #ffce71;
}

/* MOBILE */
@media(max-height: 720px) {
    .bio {
        padding: 23px 15px;
    }
    .avatar-area {
        width: 135px;
        height: 135px;
    }
    .name {
        font-size: 38px;
    }
    .official {
        margin: 8px 0 13px;
    }
    .description {
        margin-bottom: 12px;
    }
    .welcome {
        margin-bottom: 18px;
    }
    .social {
        min-height: 85px;
    }
    .footer {
        margin-top: 17px;
    }
}

@media(max-width: 360px) {
    .social {
        gap: 5px;
        padding: 10px 5px;
    }
    .social-icon {
        width: 39px;
        height: 39px;
        min-width: 39px;
    }
    .social-info h3 {
        font-size: 14px;
    }
}
</style>
</head>
