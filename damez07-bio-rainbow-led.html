<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b18">
<title>Bio | damez07</title>
<style>
:root{--gold:#ffd76a;--gold2:#b77b22;--violet:#c45bff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:34px 15px;color:#fff;font-family:Arial,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 12%,#452052 0,#21132d 42%,#09080f 100%);display:flex;align-items:center;justify-content:center;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.card{position:relative;z-index:1;width:min(100%,470px);padding:36px 24px 28px;text-align:center;border:1px solid #e9c46c88;border-radius:30px;background:linear-gradient(145deg,rgba(39,24,48,.94),rgba(13,10,20,.95));backdrop-filter:blur(14px);box-shadow:0 0 25px #b77b2240,0 0 55px #a43bff30,0 22px 75px #000b;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;border-radius:30px;padding:1px;background:linear-gradient(135deg,#ffe9a0,#b77b22,#e9b84d,#b44cff,#ffe9a0);background-size:300% 300%;animation:borderGlow 8s linear infinite;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes borderGlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.gold-corner{position:absolute;color:#f5cf72;opacity:.8;font-size:28px;text-shadow:0 0 12px #e4ad43;pointer-events:none}
.gold-corner.one{top:16px;left:17px}.gold-corner.two{top:16px;right:17px}.gold-corner.three{bottom:16px;left:17px}.gold-corner.four{bottom:16px;right:17px}
.avatar-wrap{position:relative;width:150px;height:150px;margin:10px auto 20px}\n.rainbow-ring{position:absolute;inset:-27px;border-radius:50%;background:conic-gradient(#ff1744,#ff9100,#ffee00,#00e676,#00e5ff,#2979ff,#d500f9,#ff1744);animation:spin 3.2s linear infinite;filter:drop-shadow(0 0 7px #ff4df0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));}\n.rainbow-ring:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid #ffffffaa;filter:blur(2px)}
.avatar-wrap:before,.avatar-wrap:after{content:"";position:absolute;inset:-11px;border-radius:50%;border:2px solid transparent;border-top-color:#ff71cb;border-right-color:#d6a647;filter:drop-shadow(0 0 9px #e4ad43);animation:spin 5s linear infinite}
.avatar-wrap:after{inset:-19px;border-top-color:#ffe8a0;border-bottom-color:#a84cff;animation-direction:reverse;animation-duration:9s}
.orbit{position:absolute;inset:-28px;border:1px dashed #f4d17b99;border-radius:50%;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid #fff0c5;box-shadow:0 0 18px #ff50cf,0 0 38px #d6a64788}
h1{font-size:36px;letter-spacing:3px;margin:17px 0 7px;color:#fff4d0;text-shadow:0 0 10px #e8b84d,0 0 25px #a735ff;animation:nameGlow 2.5s ease-in-out infinite alternate}
@keyframes nameGlow{to{text-shadow:0 0 17px #ffe59a,0 0 36px #d69a36}}
.verified{color:#d7f5ff;font-size:13px;font-weight:900;letter-spacing:2px;text-shadow:0 0 9px #30caff}
.bio{color:#e8ddeb;line-height:1.75;margin:19px auto 22px;max-width:350px;font-size:15px}
.tag{display:inline-block;padding:9px 17px;border:1px solid #d6a647;border-radius:24px;color:#ffe6a3;font-size:12px;font-weight:900;letter-spacing:1.5px;margin-bottom:23px;box-shadow:0 0 15px #d6a64744,inset 0 0 12px #d6a64718}
.links{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:5px}
.link{--accent:#d6a647;position:relative;isolation:isolate;min-height:66px;display:flex;align-items:center;justify-content:flex-start;gap:12px;text-decoration:none;color:#fff;font-weight:850;font-size:15px;letter-spacing:.2px;padding:11px 13px;border:1px solid color-mix(in srgb,var(--accent) 72%,transparent);border-radius:19px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.025) 48%),linear-gradient(110deg,#30213e,#17121f);box-shadow:inset 0 1px 0 #ffffff22,0 7px 18px #0005,0 0 15px color-mix(in srgb,var(--accent) 16%,transparent);transition:transform .25s,box-shadow .25s,border-color .25s;overflow:hidden}
.link:before{content:"";position:absolute;z-index:-1;inset:-2px;background:linear-gradient(110deg,transparent 20%,color-mix(in srgb,var(--accent) 35%,transparent),transparent 75%);transform:translateX(-120%);transition:transform .7s}
.link:after{content:"↗";margin-left:auto;flex:0 0 25px;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;font-size:14px;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);border:1px solid color-mix(in srgb,var(--accent) 38%,transparent)}
.link:hover:before{transform:translateX(120%)}.link:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:inset 0 1px 0 #ffffff33,0 10px 25px #0007,0 0 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.link-icon{width:39px;height:39px;flex:0 0 39px;display:grid;place-items:center;border-radius:13px;font-size:19px;font-weight:900;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,#17121f);border:1px solid color-mix(in srgb,var(--accent) 48%,transparent);box-shadow:inset 0 0 12px color-mix(in srgb,var(--accent) 12%,transparent),0 0 13px color-mix(in srgb,var(--accent) 18%,transparent)}
.link-label{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}.link-label small{font-size:9px;font-weight:700;letter-spacing:1.2px;color:#c9bdcf;opacity:.8}
.telegram{--accent:#45c8f5}.facebook{--accent:#78aaff}.tiktok{--accent:#48e4df}.discord{--accent:#a99aff}
@media(max-width:390px){.links{grid-template-columns:1fr}.link{min-height:62px}}
footer{color:#d2b77b;font-size:12px;margin-top:26px;letter-spacing:1px}
@media(max-width:380px){.card{padding:30px 17px}.avatar-wrap{width:132px;height:132px}h1{font-size:30px}.link{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
let w,h,dpr,stars=[],dust=[],branches=[];
const rand=(a,b)=>Math.random()*(b-a)+a;
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
 canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:Math.max(28,Math.floor(w/13))},()=>({x:rand(0,w),y:rand(-h,h),len:rand(12,42),v:rand(.7,2.8),r:rand(.7,2),phase:rand(0,6.28)}));
 dust=Array.from({length:95},()=>({x:rand(0,w),y:rand(0,h),r:rand(.5,1.8),v:rand(.15,.65),p:rand(0,6.28)}));
 branches=Array.from({length:Math.max(8,Math.floor(w/48))},(_,i)=>({x:(i+.5)*w/Math.max(8,Math.floor(w/48)),y:rand(0,h),side:Math.random()>.5?1:-1,scale:rand(.55,1.1),phase:rand(0,6.28)}));
}
function drawBranch(b,t){
 ctx.save();ctx.translate(b.x,b.y);ctx.scale(b.scale,b.scale);ctx.globalAlpha=.22+.12*Math.sin(t/45+b.phase);
 ctx.strokeStyle='#e8bd58';ctx.fillStyle='#f2ce75';ctx.lineWidth=1.4;
 // Cành vàng thanh, lá nhọn hai bên như nhánh trang trí
 ctx.beginPath();ctx.moveTo(0,32);ctx.quadraticCurveTo(b.side*7,0,b.side*2,-34);ctx.stroke();
 for(let i=0;i<6;i++){
  let yy=23-i*10,xx=b.side*(i%2?5:1);
  ctx.beginPath();ctx.moveTo(xx,yy);ctx.quadraticCurveTo(xx+b.side*19,yy-13,xx+b.side*25,yy-3);ctx.quadraticCurveTo(xx+b.side*12,yy+3,xx,yy);ctx.fill();
  ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+b.side*20,yy-3);ctx.stroke();
 }
 ctx.restore();
}
function draw(){
 let t=performance.now();ctx.clearRect(0,0,w,h);
 // Cành vàng lấp lánh chạy dọc nền
 for(const b of branches)drawBranch(b,t);
 // Hạt bụi vàng và tím
 for(const p of dust){
  p.y-=p.v;if(p.y<-5){p.y=h+5;p.x=rand(0,w)}
  let a=.25+.45*(.5+.5*Math.sin(t/700+p.p));
  ctx.globalAlpha=a;ctx.fillStyle=Math.sin(p.p)>0?'#ffe6a0':'#dca5ff';
  ctx.shadowBlur=10;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 // Sao băng LED
 for(const s of stars){
  s.x-=s.v*.28;s.y+=s.v;
  if(s.y>h+45||s.x<-60){s.x=rand(0,w);s.y=rand(-130,-15);}
  ctx.save();ctx.globalAlpha=.5+.5*Math.sin(t/350+s.phase);ctx.lineWidth=s.r;ctx.lineCap='round';
  let g=ctx.createLinearGradient(s.x,s.y-s.len,s.x,s.y);
  g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.7,'#e6b8ff');g.addColorStop(1,'#fff4c5');
  ctx.strokeStyle=g;ctx.shadowBlur=16;ctx.shadowColor='#e9b84d';
  ctx.beginPath();ctx.moveTo(s.x+s.len*.2,s.y-s.len);ctx.lineTo(s.x,s.y);ctx.stroke();
  ctx.fillStyle='#fff7d6';ctx.beginPath();ctx.arc(s.x,s.y,s.r*1.5,0,Math.PI*2);ctx.fill();
  // tia lóe 4 cánh
  if(Math.sin(t/300+s.phase)>.82){ctx.strokeStyle='#fff1bb';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(s.x-6,s.y);ctx.lineTo(s.x+6,s.y);ctx.moveTo(s.x,s.y-6);ctx.lineTo(s.x,s.y+6);ctx.stroke();}
  ctx.restore();
 }
 ctx.globalAlpha=1;requestAnimationFrame(draw);
}
addEventListener('resize',resize,{passive:true});resize();draw();
</script>
